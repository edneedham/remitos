# Optional: repository Variable PROD_API_BASE_URL (e.g. https://api.example.com, no trailing slash)
# enables post-deploy HTTP smoke on pushes to main after Cloud Run deploy.
name: Backend CI/CD

on:
  pull_request:
    branches: ['main']
    paths:
      - 'backend/**'
  push:
    branches: ['main']
    paths:
      - 'backend/**'

env:
  PROJECT_ID: remitos-backend
  REGION: southamerica-east1
  REPOSITORY: remitos
  IMAGE_NAME: server
  SERVICE_NAME: remitos-api
  SERVICE_ACCOUNT: backend-service@remitos-backend.iam.gserviceaccount.com
  WORKLOAD_IDENTITY_PROVIDER: projects/865349418409/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify THIRD_PARTY_LICENSES.txt matches go list -deps
        run: |
          ./scripts/gen-third-party-licenses.sh
          git diff --exit-code -- THIRD_PARTY_LICENSES.txt

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: backend/go.sum

      - name: Run Tests
        run: go test ./... -v

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: backend-deploy-main
      cancel-in-progress: true
    defaults:
      run:
        working-directory: ./backend
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          token_format: 'access_token'
          workload_identity_provider: '${{ env.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ env.SERVICE_ACCOUNT }}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Auth
        id: docker-auth
        uses: docker/login-action@v3
        with:
          username: 'oauth2accesstoken'
          password: '${{ steps.auth.outputs.access_token }}'
          registry: '${{ env.REGION }}-docker.pkg.dev'

      - name: Build and Push Container
        run: |
          IMAGE_URL="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}"
          docker build -t ${IMAGE_URL}:latest .
          docker push ${IMAGE_URL}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: '${{ env.SERVICE_NAME }}'
          region: '${{ env.REGION }}'
          image: '${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:latest'
          flags: '--service-account=${{ env.SERVICE_ACCOUNT }}'
          # By not specifying env_vars here, it preserves the existing ones set in Cloud Run
          # By not specifying secrets here, it preserves the existing DB_PASSWORD and JWT_SECRET bindings

      - name: Post-deploy smoke (optional)
        if: ${{ vars.PROD_API_BASE_URL != '' }}
        env:
          BASE_URL: ${{ vars.PROD_API_BASE_URL }}
        run: |
          set -euo pipefail
          base="${BASE_URL%/}"
          echo "Smoke GET ${base}/health"
          curl -fsS "${base}/health" | tee /dev/stderr | grep -q 'ok'
          echo "Smoke GET ${base}/health/ready"
          curl -fsS "${base}/health/ready" | tee /dev/stderr | grep -q 'ok'
          echo "Smoke GET ${base}/webhooks/mercadopago"
          curl -fsS -o /dev/null "${base}/webhooks/mercadopago"
