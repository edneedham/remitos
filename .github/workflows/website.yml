name: Website CI

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'design-tokens/**'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'design-tokens/**'
      - '.github/workflows/website.yml'

defaults:
  run:
    working-directory: ./website

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: website/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify design tokens are in sync
        run: pnpm gen:tokens:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
